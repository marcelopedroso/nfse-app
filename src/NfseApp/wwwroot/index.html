<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFS-e</title>
<link rel="icon" href="/icone.png">
<meta name="theme-color" content="#121418">
<script>
  // Aplica o tema antes de pintar a página, para não piscar claro → escuro.
  (() => {
    let tema = null;
    try { tema = localStorage.getItem("tema"); } catch { }
    if (tema !== "claro" && tema !== "escuro") tema = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
    document.documentElement.dataset.tema = tema;
    // Barra lateral recolhida: escolha do usuário, ou automática em janela estreita.
    let barra = null;
    try { barra = localStorage.getItem("barra"); } catch { }
    if (barra === "recolhida" || matchMedia("(max-width: 760px)").matches) document.documentElement.dataset.barra = "recolhida";
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2; --card: #ffffff; --txt: #16171a; --sub: #5f6168; --muted: #8a8c93; --linha: #e6e5e1; --campo: #fafaf8;
    --btn: #1f66c2; --btn-hover: #1a56a5; --btn-txt: #ffffff; --link: #1f66c2; --serie: #2a78d6;
    --ok: #157f3c; --ok-fundo: #e8f5ec; --erro: #b42318; --erro-fundo: #fdecea; --hom: #9a6200; --hom-fundo: #fdf3dc;
    --sombra: 0 1px 2px rgb(20 20 20 / .04), 0 2px 8px rgb(20 20 20 / .04);
    /* A barra lateral é escura nos dois temas. */
    --lat: #121418; --lat-txt: #e9eaec; --lat-sub: #8e939c; --lat-ativo: #20242b; --lat-linha: #262a31;
  }
  :root[data-tema="escuro"] {
    color-scheme: dark;
    --bg: #0e0f12; --card: #17191e; --txt: #ecedef; --sub: #a4a7ae; --muted: #7d8189; --linha: #262930; --campo: #121418;
    --btn: #2f74d0; --btn-hover: #4384dc; --btn-txt: #ffffff; --link: #6aa5f0; --serie: #3987e5;
    --ok: #4cc27a; --ok-fundo: #12291b; --erro: #f17a6c; --erro-fundo: #2f1614; --hom: #e3b341; --hom-fundo: #2b2310;
    --sombra: 0 1px 2px rgb(0 0 0 / .35);
    --lat: #0a0b0d; --lat-ativo: #1a1d22; --lat-linha: #1d2026;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--txt); }
  h1, h2, h3, .numero-grande { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--link); }
  .oculto { display: none !important; }
  .sub { color: var(--sub); }
  .muted { color: var(--muted); }
  svg.ic { width: 16px; height: 16px; flex: none; }

  /* ---------- estrutura ---------- */
  .shell { display: flex; min-height: 100%; }
  .lateral { width: 232px; flex: none; background: var(--lat); color: var(--lat-txt); display: flex; flex-direction: column;
             padding: 18px 14px; position: sticky; top: 0; height: 100vh; }
  .marca { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; font-weight: 600; font-size: 15px; }
  .marca img { width: 26px; height: 26px; }
  .selo-edicao { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--lat-txt); background: var(--lat-ativo);
                 border: 1px solid var(--lat-linha); border-radius: 4px; padding: 1px 6px; }
  .btn-nova { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 18px;
              background: var(--btn); color: var(--btn-txt); border: 0; border-radius: 8px; padding: 9px 12px; font-weight: 600; cursor: pointer; }
  .btn-nova:hover { background: var(--btn-hover); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--lat-sub); text-align: left;
                padding: 8px 10px; border-radius: 7px; cursor: pointer; }
  .nav button:hover { color: var(--lat-txt); background: var(--lat-ativo); }
  .nav button.ativo { color: var(--lat-txt); background: var(--lat-ativo); font-weight: 600; }
  .rodape-lat { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid var(--lat-linha); }
  .rotulo-lat { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--lat-sub); margin-bottom: 6px; }
  .segmentado { display: grid; grid-template-columns: 1fr 1fr; background: var(--lat-ativo); border-radius: 8px; padding: 3px; gap: 3px; }
  .segmentado button { border: 0; background: none; color: var(--lat-sub); padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  .segmentado button.ativo { background: var(--lat); color: var(--lat-txt); font-weight: 600; box-shadow: 0 0 0 1px var(--lat-linha); }
  .amb-fixo { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .ponto.hom { background: var(--hom); }
  .cert-lat { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700;
            background: var(--lat-ativo); color: var(--lat-txt); border: 1px solid var(--lat-linha); flex: none; }
  .cert-lat .nome { font-size: 13px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .cert-lat .doc { font-size: 11.5px; color: var(--lat-sub); }
  .acoes-lat { display: flex; gap: 6px; }
  .acoes-lat button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: none; color: var(--lat-sub);
                      border: 1px solid var(--lat-linha); border-radius: 7px; padding: 6px; cursor: pointer; font-size: 12.5px; }
  .acoes-lat button:hover { color: var(--lat-txt); border-color: var(--lat-sub); }
  .versao-lat { font-size: 11px; color: var(--lat-sub); cursor: help; }
  .recolher { display: flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--lat-sub); padding: 6px 8px;
              border-radius: 7px; cursor: pointer; font-size: 12.5px; }
  .recolher:hover { color: var(--lat-txt); background: var(--lat-ativo); }
  .recolher kbd { margin-left: auto; font: inherit; font-size: 11px; color: var(--lat-sub); border: 1px solid var(--lat-linha); border-radius: 4px; padding: 0 5px; }
  .amb-recolhido { display: none; }

  /* Barra recolhida (botão "Recolher" ou Ctrl+B): só ícones; o nome aparece no title de cada um. */
  .lateral { transition: width .18s ease, padding .18s ease; }
  :root[data-barra="recolhida"] .lateral { width: 64px; padding: 18px 10px; }
  :root[data-barra="recolhida"] .lateral :is(.txt, .marca span, .rotulo-lat, .cert-lat > div, .versao-lat, .segmentado, .recolher kbd) { display: none !important; }
  :root[data-barra="recolhida"] .marca { justify-content: center; padding: 2px 0 18px; }
  :root[data-barra="recolhida"] .lateral :is(.btn-nova, .nav button, .recolher, .cert-lat, .amb-fixo) { justify-content: center; }
  :root[data-barra="recolhida"] .lateral :is(.btn-nova, .nav button) { padding-left: 0; padding-right: 0; }
  :root[data-barra="recolhida"] .acoes-lat { flex-direction: column; }
  :root[data-barra="recolhida"] .amb-recolhido { display: flex; justify-content: center; }

  main { flex: 1; min-width: 0; padding: 30px 36px 48px; }
  .conteudo { max-width: 1120px; margin: 0 auto; }
  .cabecalho { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .cabecalho h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .cabecalho .sub { margin-top: 2px; }
  .cabecalho .direita { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .card { background: var(--card); border: 1px solid var(--linha); border-radius: 12px; box-shadow: var(--sombra); }
  .card-corpo { padding: 20px 22px; }
  .card-titulo { display: flex; align-items: baseline; gap: 10px; padding: 16px 22px 0; }
  .card-titulo h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .card-titulo .direita { margin-left: auto; }

  /* ---------- botões e campos ---------- */
  .btn { display: inline-flex; align-items: center; gap: 7px; background: var(--btn); color: var(--btn-txt); border: 0; border-radius: 8px;
         padding: 8px 14px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--btn-hover); }
  .btn.sec { background: var(--card); color: var(--txt); border: 1px solid var(--linha); font-weight: 500; }
  .btn.sec:hover:not(:disabled) { background: var(--campo); border-color: var(--muted); }
  .btn.icone { padding: 6px 8px; font-weight: 500; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: default; }
  label.campo { display: block; }
  label.campo > span { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 5px; font-weight: 500; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--linha); border-radius: 8px; background: var(--campo); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--btn); outline-offset: -1px; background: var(--card); }
  textarea { resize: vertical; }
  .ajuda { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 4px; border-radius: 50%; vertical-align: 1px;
           border: 1px solid var(--muted); color: var(--muted); font-size: 10px; font-weight: 700; cursor: help; }
  .pilula { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
  .pilula.ok { color: var(--ok); background: var(--ok-fundo); }
  .pilula.canc { color: var(--erro); background: var(--erro-fundo); }
  .pilula.hom { color: var(--hom); background: var(--hom-fundo); }
  .pilula.prod { color: var(--ok); background: var(--ok-fundo); }
  .msg { padding: 11px 14px; border-radius: 10px; margin-bottom: 16px; border: 1px solid; font-size: 13.5px; }
  .msg.erro { color: var(--erro); background: var(--erro-fundo); border-color: transparent; }
  .msg.ok { color: var(--ok); background: var(--ok-fundo); border-color: transparent; }
  .msg.info { color: var(--sub); background: var(--card); border-color: var(--linha); }

  /* ---------- início ---------- */
  .heroi { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .tile { padding: 18px 20px; }
  .tile .rotulo { font-size: 12.5px; color: var(--sub); font-weight: 500; }
  .tile .valor { font-size: 22px; font-weight: 600; margin-top: 6px; letter-spacing: -.01em; }
  .tile .detalhe { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .tile.principal .valor { font-size: 40px; line-height: 1.1; }
  .duas-colunas { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-bottom: 14px; }
  .proxima { display: flex; flex-direction: column; gap: 12px; height: 100%; }
  .proxima .tomador { font-size: 16px; font-weight: 600; }
  .grafico { position: relative; padding: 8px 22px 16px; }
  .grafico svg { width: 100%; height: auto; display: block; overflow: visible; }
  .grafico .barra { fill: var(--serie); }
  .grafico .barra-alvo { fill: transparent; cursor: default; outline: none; }
  .grafico .barra-alvo:focus-visible { stroke: var(--btn); stroke-width: 1.5; }
  .grafico .grade { stroke: var(--linha); stroke-width: 1; }
  .grafico .base { stroke: var(--muted); stroke-width: 1; }
  .grafico text { fill: var(--sub); font-size: 11px; }
  .grafico text.valor-barra { fill: var(--txt); font-weight: 600; }
  .tooltip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--linha); border-radius: 8px;
             box-shadow: 0 4px 16px rgb(0 0 0 / .12); padding: 8px 10px; font-size: 12.5px; white-space: nowrap; transform: translate(-50%, -100%); }
  .tooltip strong { display: block; font-size: 14px; }
  details.tabela-grafico { padding: 0 22px 16px; font-size: 12.5px; color: var(--sub); }
  details.tabela-grafico summary { cursor: pointer; }

  /* ---------- listas ---------- */
  table.lista { width: 100%; border-collapse: collapse; }
  table.lista th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
                   padding: 12px 14px; border-bottom: 1px solid var(--linha); }
  table.lista td { padding: 12px 14px; border-bottom: 1px solid var(--linha); vertical-align: middle; }
  table.lista tbody tr:hover { background: var(--campo); }
  table.lista tbody tr:last-child td { border-bottom: 0; }
  table.lista .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.lista .nnota { font-variant-numeric: tabular-nums; font-weight: 600; }
  table.lista tfoot td { border-top: 1px solid var(--linha); border-bottom: 0; font-weight: 600; background: var(--campo); }
  th[title] { cursor: help; }
  tr.cancelada td:not(.sit):not(.acoes) { color: var(--muted); }
  tr.cancelada .valor-cancelado { text-decoration: line-through; }
  .nome-doc .doc { font-size: 12px; color: var(--muted); }
  .acoes { white-space: nowrap; text-align: right; }
  .barra-ferramentas { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
  .chips { display: inline-flex; background: var(--campo); border: 1px solid var(--linha); border-radius: 8px; padding: 2px; }
  .chips button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--sub); }
  .chips button.ativo { background: var(--card); color: var(--txt); font-weight: 600; box-shadow: var(--sombra); }
  .busca { position: relative; flex: 1; max-width: 320px; }
  .busca input { padding-left: 32px; }
  .busca svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .iniciais { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700;
              background: var(--campo); border: 1px solid var(--linha); color: var(--sub); }
  .vazio { padding: 36px; text-align: center; color: var(--sub); }

  /* ---------- nova nota ---------- */
  .nova { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .secao { padding: 20px 22px; border-bottom: 1px solid var(--linha); }
  .secao:last-child { border-bottom: 0; }
  .secao h3 { font-size: 13px; font-weight: 600; margin: 0 0 14px; color: var(--txt); }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .grade .inteiro { grid-column: 1 / -1; }
  .origem { display: flex; gap: 10px; align-items: center; padding: 12px 22px; background: var(--campo); border-bottom: 1px solid var(--linha);
            border-radius: 12px 12px 0 0; font-size: 13px; color: var(--sub); }
  .resumo { position: sticky; top: 20px; }
  .resumo .linha { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 13.5px; }
  .resumo .linha span:last-child { font-variant-numeric: tabular-nums; }
  .resumo .total { border-top: 1px solid var(--linha); margin-top: 8px; padding-top: 14px; }
  .resumo .total .numero-grande { font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .resumo .meta { font-size: 12.5px; color: var(--muted); margin: 12px 0 16px; line-height: 1.6; }
  .resumo .btn { width: 100%; justify-content: center; padding: 10px; }
  .herdado { font-size: 12.5px; color: var(--sub); line-height: 1.7; }
  .herdado b { color: var(--txt); font-weight: 600; }

  dialog { border: 1px solid var(--linha); border-radius: 14px; padding: 0; width: min(560px, 92vw); background: var(--card); color: var(--txt);
           box-shadow: 0 20px 60px rgb(0 0 0 / .25); }
  dialog::backdrop { background: rgb(10 12 16 / .55); }
  .dlg-cab { padding: 18px 22px 6px; display: flex; align-items: center; gap: 10px; }
  .dlg-cab h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .dlg-corpo { padding: 8px 22px 6px; max-height: 52vh; overflow: auto; }
  .dlg-corpo table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .dlg-corpo td { padding: 6px 0; border-bottom: 1px solid var(--linha); vertical-align: top; }
  .dlg-acao { padding: 0 22px; }
  .dlg-acao .msg { margin: 12px 0 0; }
  .dlg-corpo td:first-child { color: var(--sub); width: 44%; padding-right: 10px; }
  .dlg-corpo tr.destaque td { font-weight: 700; font-size: 15px; border-bottom: 0; padding-top: 12px; }
  .dlg-rodape { padding: 14px 22px 18px; display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  .confirmo { display: flex; gap: 9px; align-items: flex-start; padding: 12px 14px; margin: 12px 0 4px; border-radius: 10px;
              background: var(--campo); border: 1px solid var(--linha); color: var(--txt); font-size: 13.5px; cursor: pointer; }
  .confirmo input { width: auto; margin-top: 3px; }

  /* ---------- login ---------- */
  .login { min-height: 100vh; display: grid; grid-template-columns: 420px 1fr; }
  .login-lado { background: var(--lat); color: var(--lat-txt); padding: 48px 44px; display: flex; flex-direction: column; }
  .login-lado .marca { padding: 0; font-size: 17px; }
  .login-lado h1 { font-size: 30px; line-height: 1.2; font-weight: 600; margin: auto 0 14px; letter-spacing: -.01em; }
  .login-lado p { color: var(--lat-sub); margin: 0 0 6px; }
  .login-lado .versao-lat { margin-top: 36px; }
  .login-form { display: grid; place-items: center; padding: 40px; }
  .login-form .caixa { width: min(520px, 100%); }
  .login-form h2 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .certs { display: grid; gap: 10px; margin-top: 20px; }
  .cert { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--card); border: 1px solid var(--linha); border-radius: 12px;
          padding: 14px 16px; cursor: pointer; box-shadow: var(--sombra); }
  .cert:hover { border-color: var(--btn); }
  .cert .seta { margin-left: auto; color: var(--muted); }

  @media (max-width: 1000px) {
    .heroi { grid-template-columns: 1fr 1fr; }
    .duas-colunas, .nova { grid-template-columns: 1fr; }
    .resumo { position: static; }
    .login { grid-template-columns: 1fr; }
    .login-lado { display: none; }
  }
  @media (max-width: 760px) {
    main { padding: 20px 16px 40px; }
    .grade { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="lateral oculto" id="lateral"></aside>
  <main id="app"></main>
</div>

<dialog id="confirmar"></dialog>

<script>
const estado = { perfil: null, info: null, amb: "prod", tela: "inicio", filtro: "emitidas", busca: "", ultimaSync: null };
const $ = id => document.getElementById(id);
const app = $("app");

// ---------- formatação ----------
const brl = v => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const brlCurto = v => {
  const n = Number(v || 0);
  if (Math.abs(n) >= 1e6) return "R$ " + (n / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mi";
  if (Math.abs(n) >= 1e3) return "R$ " + (n / 1e3).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil";
  return brl(n);
};
const data = s => s ? new Date(s.length === 10 ? s + "T12:00:00" : s).toLocaleDateString("pt-BR") : "";
const dataCurta = s => s ? new Date(s.length === 10 ? s + "T12:00:00" : s).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : "";
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const doc = d => d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5")
                : d.length === 11 ? d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4") : d;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = v => Number(v).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + "%";
const hora = d => d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const nomeAmb = a => a === "prod" ? "Produção" : "Homologação";
const iniciais = nome => (nome || "?").replace(/\b(S\.?A\.?|LTDA\.?|ME|EPP|EIRELI)\b/gi, "").trim().split(/\s+/).slice(0, 2).map(p => p[0]).join("").toUpperCase();
const nomeCurto = nome => (nome || "").split(/\s+/).slice(0, 3).join(" ");
const ajuda = texto => `<span class="ajuda" title="${esc(texto)}">?</span>`;
// O selo de ambiente só aparece na edição que tem os dois; na do dia a dia tudo é produção e o selo seria ruído.
const pilulaAmb = a => !estado.info?.temHomologacao ? "" :

// ---------- API ----------
async function api(caminho, opcoes = {}) {
  const r = await fetch(caminho, { ...opcoes, headers: { "Content-Type": "application/json", "X-NfseApp": "1", ...(opcoes.headers || {}) } });
  const corpo = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(corpo?.erro || corpo || ("HTTP " + r.status));
  return corpo;
}
const post = (caminho, corpo) => api(caminho, { method: "POST", body: JSON.stringify(corpo || {}) });

function mensagem(tipo, texto) { return `<div class="msg ${tipo}">${texto}</div>`; }
function carregando(texto) { app.innerHTML = `<div class="conteudo"><div class="card card-corpo sub">${esc(texto)}…</div></div>`; }

function alternarBarra() {
  const recolher = document.documentElement.dataset.barra !== "recolhida";

  else delete document.documentElement.dataset.barra;
  try { localStorage.setItem("barra", recolher ? "recolhida" : "aberta"); } catch { }
  montarLateral();
}

  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "b" && estado.perfil) { e.preventDefault(); alternarBarra(); }
});

  document.querySelectorAll(".nav [data-tela]").forEach(b => b.classList.toggle("ativo", b.dataset.tela === estado.tela));

  carregando("Buscando notas novas no Ambiente Nacional");
  const ambientes = amb === "prod" ? ["prod"] : ["prod", amb]; // tomadores e notas-base vêm sempre da produção
  try { for (const a of ambientes) await post(`/api/sincronizar?amb=${a}`); estado.ultimaSync = new Date(); }
  catch { /* sem rede: mostra o que já está salvo; o botão Atualizar continua disponível */ }

async function sincronizar(depois) {
  carregando("Buscando notas no Ambiente Nacional");

// Barras de uma série só: uma cor, sem legenda (o título diz o que é), valor escrito só no maior e no mês mais recente com nota.
function desenharGrafico(alvo, meses) {
  const L = 680, A = 210, esq = 54, topo = 18, base = 178;
  const max = Math.max(...meses.map(m => m.total), 1);
  const passo = Math.pow(10, Math.floor(Math.log10(max)));
  const teto = Math.ceil(max / passo) * passo;
  const y = v => base - (v / teto) * (base - topo);
  const faixa = (L - esq) / meses.length;
  const largura = Math.min(24, faixa * 0.55);
  const maior = meses.reduce((a, m, i) => m.total > meses[a].total ? i : a, 0);
  const recente = meses.map(m => m.qtd > 0).lastIndexOf(true);
  const curto = v => v >= 1e3 ? (v / 1e3).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : v.toLocaleString("pt-BR");

  let svg = `<svg viewBox="0 0 ${L} ${A}" role="img" aria-label="Faturamento por mês nos últimos 12 meses">`;
  for (const v of [teto / 2, teto]) svg += `<line class="grade" x1="${esq}" x2="${L}" y1="${y(v)}" y2="${y(v)}"/><text x="${esq - 8}" y="${y(v) + 4}" text-anchor="end">${curto(v)}</text>`;
  svg += `<line class="base" x1="${esq}" x2="${L}" y1="${base}" y2="${base}"/><text x="${esq - 8}" y="${base + 4}" text-anchor="end">0</text>`;
  meses.forEach((m, i) => {
    const cx = esq + faixa * i + faixa / 2, x = cx - largura / 2;
    if (m.total > 0) {
      const t = y(m.total), r = Math.min(4, (base - t) / 2);
      // Ponta arredondada (4px) em cima, quadrada na base.
      svg += `<path class="barra" d="M${x},${base} V${t + r} Q${x},${t} ${x + r},${t} H${x + largura - r} Q${x + largura},${t} ${x + largura},${t + r} V${base} Z"/>`;
      if (i === maior || i === recente) svg += `<text class="valor-barra" x="${cx}" y="${t - 6}" text-anchor="middle">${curto(m.total)}</text>`;
    }
    const rotulo = MESES[m.data.getMonth()].slice(0, 3) + (m.data.getMonth() === 0 || i === 0 ? "/" + String(m.data.getFullYear()).slice(2) : "");
    svg += `<text x="${cx}" y="${base + 18}" text-anchor="middle">${rotulo}</text>`;
    svg += `<rect class="barra-alvo" tabindex="0" data-i="${i}" x="${esq + faixa * i + 1}" y="${topo - 10}" width="${faixa - 2}" height="${base - topo + 10}"/>`;
  });
  svg += `</svg>`;
  alvo.innerHTML = svg + `<div class="tooltip oculto"></div>`;

  const dica = alvo.querySelector(".tooltip");
  const mostrarDica = (el) => {
    const m = meses[+el.dataset.i];
    dica.replaceChildren();
    const forte = document.createElement("strong");
    forte.textContent = brl(m.total);
    dica.append(forte, document.createTextNode(`${MESES[m.data.getMonth()]} ${m.data.getFullYear()} · ${m.qtd} nota(s)`));
    const caixa = alvo.getBoundingClientRect(), r = el.getBoundingClientRect();
    const svgEl = alvo.querySelector("svg"), escala = svgEl.getBoundingClientRect().height / A;
    dica.style.left = (r.left - caixa.left + r.width / 2) + "px";
    dica.style.top = (svgEl.getBoundingClientRect().top - caixa.top + (m.total > 0 ? y(m.total) : base) * escala - 8) + "px";
    dica.classList.remove("oculto");
  };
  alvo.querySelectorAll(".barra-alvo").forEach(el => {
    el.addEventListener("pointerenter", () => mostrarDica(el));
    el.addEventListener("focus", () => mostrarDica(el));
    el.addEventListener("pointerleave", () => dica.classList.add("oculto"));
    el.addEventListener("blur", () => dica.classList.add("oculto"));
  });
}

  return `
    <table class="lista">
      <thead><tr><th>Nº</th><th>${filtro === "emitidas" ? "Tomador" : "Prestador"}</th>
        <th title="Data a que o serviço se refere; define o mês de apuração dos impostos">Competência</th>
        <th title="Data e hora em que a Sefin autorizou a nota">Emissão</th>
        <th class="num" title="Valor bruto do serviço, antes de descontos">Valor</th>
        <th class="num" title="Valor a receber: serviço menos descontos e retenções">Líquido</th>
        <th>Situação</th><th></th></tr></thead>
      <tbody>
      ${lista.map(n => `
        <tr class="${n.cancelada ? "cancelada" : ""}">
          <td class="nnota" title="Chave de acesso: ${n.chave}">${n.numero}</td>
          <td class="nome-doc">${esc(n[outra + "Nome"])}<div class="doc">${doc(n[outra + "Doc"])}</div></td>
          <td>${data(n.competencia)}</td><td>${data(n.dhProc)}</td>
          <td class="num"><span class="valor-cancelado">${brl(n.vServ)}</span></td>
          <td class="num"><span class="valor-cancelado">${brl(n.vLiq)}</span></td>
          <td class="sit">${n.cancelada
            ? `<span class="pilula canc" title="Motivo do cancelamento: ${esc(n.motivoCancelamento)}">Cancelada</span>`
            : `<span class="pilula ok" title="Autorizada pela Sefin e válida">Autorizada</span>`}</td>
          <td class="acoes">
            <a class="btn sec icone" href="/api/notas/${n.chave}/xml?amb=${estado.amb}" title="Baixar o XML oficial da nota (o documento fiscal em si)">${icone("baixar")} XML</a>
            <a class="btn sec icone" href="/api/notas/${n.chave}/pdf?amb=${estado.amb}" target="_blank" title="Gerar o DANFSe (PDF) no modelo oficial da NT 008/2026. Leva alguns segundos.">${icone("pdf")} PDF</a>
          </td>
        </tr>`).join("")}
      </tbody>
      ${comTotais ? `<tfoot><tr><td colspan="4">${ativas.length} autorizada(s)${lista.length > ativas.length ? ` · ${lista.length - ativas.length} cancelada(s) fora do total` : ""}</td>
        <td class="num">${brl(ativas.reduce((s, n) => s + n.vServ, 0))}</td><td class="num">${brl(ativas.reduce((s, n) => s + n.vLiq, 0))}</td><td colspan="2"></td></tr></tfoot>` : ""}
    </table>`;
}

async function telaNotas(aviso) {
  carregando("Carregando notas");
  let notas;
  try { notas = await api(`/api/notas?amb=${estado.amb}`); }
  catch (e) { app.innerHTML = `<div class="conteudo">${mensagem("erro", esc(e.message))}</div>`; return; }
  const desenhar = () => {
    const termo = estado.busca.trim().toLowerCase();
    const outra = estado.filtro === "emitidas" ? "toma" : "prest";
    const lista = notas[estado.filtro].filter(n => !termo || String(n.numero).includes(termo)
      || (n[outra + "Nome"] || "").toLowerCase().includes(termo) || (n[outra + "Doc"] || "").includes(termo.replace(/\D/g, "") || "#"));
    $("lista-notas").innerHTML = tabelaNotas(lista, estado.filtro, true);
  };
  app.innerHTML = `
    <div class="conteudo">
      <div class="cabecalho">
        <div><h1>Notas</h1><div class="sub">${pilulaAmb(estado.amb) ? pilulaAmb(estado.amb) + " &nbsp;" : ""}${estado.ultimaSync ? "Atualizado às " + hora(estado.ultimaSync) : ""}</div></div>
        <div class="direita">
          <button class="btn sec" id="sync" title="Busca no Ambiente de Dados Nacional (ADN) as notas e cancelamentos novos deste CNPJ">${icone("atualizar")} Atualizar</button>
          <button class="btn" id="nova">${icone("mais")} Nova nota</button>
        </div>
      </div>
      ${aviso || ""}
      <div class="card">
        <div class="barra-ferramentas">
          <div class="chips" title="Emitidas: você é o prestador. Recebidas: serviços que você contratou.">
            <button data-filtro="emitidas">Emitidas · ${notas.emitidas.length}</button>
            <button data-filtro="recebidas">Recebidas · ${notas.recebidas.length}</button>
          </div>
          <div class="busca">${icone("busca")}<input id="busca" placeholder="Buscar por nº, nome ou CNPJ" value="${esc(estado.busca)}"></div>
        </div>
        <div id="lista-notas"></div>
      </div>
    </div>`;
  const chips = app.querySelectorAll("[data-filtro]");
  const marcar = () => chips.forEach(c => c.classList.toggle("ativo", c.dataset.filtro === estado.filtro));
  chips.forEach(c => c.onclick = () => { estado.filtro = c.dataset.filtro; marcar(); desenhar(); });
  $("busca").oninput = e => { estado.busca = e.target.value; desenhar(); };
  $("sync").onclick = () => sincronizar(telaNotas);
  $("nova").onclick = () => mostrar("nova");
  marcar();
  desenhar();
}

        ${tomadores.length ? `
        <table class="lista">
          <thead><tr><th></th><th>Tomador</th><th title="E-mail informado na nota mais recente para esse cliente">E-mail</th>
            <th class="num">Notas</th><th class="num" title="Soma do valor dos serviços das notas autorizadas">Total faturado</th><th>Última nota</th><th></th></tr></thead>
          <tbody>
          ${tomadores.map(t => `

              <td class="nome-doc"><strong>${esc(t.nome)}</strong><div class="doc">${doc(t.documento)}</div></td>
              <td>${t.email ? esc(t.email) : `<span class="muted">—</span>`}</td>
              <td class="num">${t.notas}</td><td class="num">${brl(t.total)}</td>
              <td>nº ${t.ultimoNumero} · ${data(t.ultimaData)}<div class="doc muted" style="font-size:12px">${brl(t.ultimoValor)}</div></td>
              <td class="acoes"><button class="btn sec icone" data-doc="${t.documento}" title="Preparar uma nota nova copiando a última nota desse tomador">${icone("mais")} Nova nota</button></td>

// ---------- nova nota ----------
async function telaNova(tomador) {
  carregando("Buscando a última nota para copiar");
  let info, tomadores;
  try {
    [tomadores, info] = await Promise.all([
      api("/api/tomadores"),
      api(`/api/nova?amb=${estado.amb}${tomador ? "&tomador=" + tomador : ""}`),
    ]);
  } catch (e) { app.innerHTML = `<div class="conteudo">${mensagem("erro", esc(e.message))}</div>`; return; }
  const b = info.base, s = info.sugestao, t = info.tributacao;
  const prod = estado.amb === "prod";
  app.innerHTML = `
    <div class="conteudo">
      <div class="cabecalho">
        <div><h1>Nova nota</h1><div class="sub">${pilulaAmb(estado.amb) ? pilulaAmb(estado.amb) + " &nbsp;" : ""}Mesmo tomador, serviço e tributação da nota anterior; ajuste o que mudou.</div></div>
      </div>
      ${info.aviso ? mensagem("erro", esc(info.aviso)) : ""}
      <div class="nova">
        <div class="card">
          <div class="origem">${icone("notas")} Copiando a nota <strong style="color:var(--txt)">nº ${b.numero}</strong> de ${data(b.dhProc)} · ${brl(b.vServ)}</div>
          <div class="secao">
            <h3>Tomador</h3>
            <div class="grade">
              <label class="campo inteiro"><span>Cliente ${ajuda("Clientes que já receberam nota sua. Trocar o cliente muda a nota-base para a última nota dele.")}</span>
                <select id="tomador">${tomadores.map(x => `<option value="${x.documento}" ${x.documento === b.tomaDoc ? "selected" : ""}>${esc(x.nome)} · ${doc(x.documento)}</option>`).join("")}</select></label>
              <label class="campo"><span>E-mail ${ajuda(info.emailTomadorRemovido
                  ? "Em homologação o e-mail do cliente não é usado, para o teste não chegar a ele. Se quiser, informe um e-mail seu."
                  : "Veio da nota anterior. Se o cliente mudou de e-mail, corrija aqui: a nota nova sai com o e-mail novo e as próximas também.")}</span>
                <input id="email" type="email" maxlength="80" value="${esc(s.emailTomador)}" placeholder="${info.emailTomadorRemovido ? "opcional: um e-mail seu para testar" : "sem e-mail"}"></label>
              <label class="campo"><span>Telefone ${ajuda("Só números, com DDD (6 a 20 dígitos). Opcional.")}</span>
                <input id="fone" inputmode="numeric" maxlength="20" value="${esc(s.foneTomador)}" placeholder="sem telefone"></label>
            </div>
          </div>
          <div class="secao">
            <h3>Valores</h3>
            <div class="grade">
              <label class="campo"><span>Competência ${ajuda("Data a que o serviço se refere. Define o mês em que os impostos são apurados. Não pode ser futura.")}</span>
                <input id="dCompet" type="date" value="${s.dCompet}" max="${s.dCompet}"></label>
              <label class="campo"><span>Valor do serviço (R$) ${ajuda("Valor bruto do serviço, antes de qualquer desconto.")}</span>
                <input id="vServ" type="number" step="0.01" min="0.01" value="${s.vServ}"></label>
              <label class="campo"><span>Desconto incondicionado (R$) ${ajuda("Desconto que não depende de condição futura (ex.: abatimento já negociado). Reduz a base de cálculo dos tributos. Use 0 se não houver.")}</span>
                <input id="vDesc" type="number" step="0.01" min="0" value="${s.vDescIncond}"></label>
              ${info.simples ? `<label class="campo"><span>% tributos do Simples ${ajuda("Percentual aproximado de tributos do Simples, exigido pela Lei da Transparência (12.741). É informativo e vem do contador. O app lembra o último valor usado.")}</span>
                <input id="pct" type="number" step="0.01" min="0" value="${s.pTotTribSN ?? ""}" placeholder="pergunte ao contador"></label>` : ""}
            </div>
          </div>
          <div class="secao">
            <h3>Descrição do serviço ${ajuda("Texto que o tomador lê na nota. Seja específico se o cliente pedir (ex.: mês de referência, contrato).")}</h3>
            <textarea id="descricao" rows="3">${esc(s.descricao)}</textarea>
          </div>
          <div class="secao herdado" title="Vem da nota nº ${b.numero} e não muda nesta tela">
            <h3>Herdado da nota anterior</h3>
            Serviço <b>${esc(b.cTribNac)} · ${esc(b.xTribNac)}</b> · Regime <b>${esc(t.regime)}</b><br>
            Local da prestação <b>${esc(t.localPrestacao || "—")}</b> · ISS <b>${t.issRetido ? "retido pelo tomador" : "não retido (pago por você no Simples)"}</b>
          </div>
        </div>

        <div class="card card-corpo resumo">
          <div class="linha"><span class="sub">Valor do serviço</span><span id="r-serv"></span></div>
          <div class="linha"><span class="sub">Desconto</span><span id="r-desc"></span></div>
          <div class="linha"><span class="sub">Base de cálculo</span><span id="r-base"></span></div>
          ${t.pAliqPis != null ? `<div class="linha"><span class="sub">PIS ${pct(t.pAliqPis)}</span><span id="r-pis"></span></div>` : ""}
          ${t.pAliqCofins != null ? `<div class="linha"><span class="sub">COFINS ${pct(t.pAliqCofins)}</span><span id="r-cofins"></span></div>` : ""}
          <div class="linha"><span class="sub">ISS</span><span>${t.issRetido ? "retido" : "não retido"}</span></div>
          <div class="total">
            <div class="sub" style="font-size:12.5px">Valor líquido ${ajuda("Estimativa: valor do serviço menos o desconto. O valor oficial é calculado pela Sefin e aparece na nota.")}</div>
            <div class="numero-grande" id="r-liq"></div>
          </div>
          <div class="meta">${pilulaAmb(estado.amb) ? pilulaAmb(estado.amb) + "<br>" : ""}Série ${info.serie} · DPS nº ${info.proximoNDps} ${ajuda("Número da Declaração de Prestação de Serviço: sequência sua; o app usa o próximo depois do último já autorizado. O número da NFS-e é dado pela Sefin.")}</div>
          <button class="btn" id="revisar" title="Mostra o resumo completo para conferir. Ainda não emite.">Revisar e emitir</button>
        </div>
      </div>
    </div>`;

  const campo = id => $(id);
  const baseDe = () => (+campo("vServ").value || 0) - (+campo("vDesc").value || 0);
  const imposto = aliq => Math.round(baseDe() * aliq) / 100;
  const atualizar = () => {
    campo("r-serv").textContent = brl(+campo("vServ").value || 0);
    campo("r-desc").textContent = "− " + brl(+campo("vDesc").value || 0);
    campo("r-base").textContent = brl(baseDe());
    if (t.pAliqPis != null) campo("r-pis").textContent = brl(imposto(t.pAliqPis));
    if (t.pAliqCofins != null) campo("r-cofins").textContent = brl(imposto(t.pAliqCofins));
    campo("r-liq").textContent = t.issRetido ? "pela Sefin" : brl(baseDe());
  };
  ["vServ", "vDesc"].forEach(id => campo(id).oninput = atualizar);
  atualizar();
  campo("tomador").onchange = () => telaNova(campo("tomador").value);
  campo("revisar").onclick = () => abrirConfirmacao(info, prod, {
    amb: estado.amb, baseChave: b.chave, dCompet: campo("dCompet").value,
    vServ: +campo("vServ").value, vDescIncond: +campo("vDesc").value || 0,
    descricao: campo("descricao").value,
    emailTomador: campo("email").value.trim(), foneTomador: campo("fone").value.replace(/\D/g, ""),
    pTotTribSN: info.simples ? (campo("pct").value === "" ? null : +campo("pct").value) : null,
    confirmoProducao: false,
  }, baseDe, imposto);
}

function abrirConfirmacao(info, prod, dados, baseDe, imposto) {
  const b = info.base, t = info.tributacao, dlg = $("confirmar");
  const contato = (atual, antes) => esc(atual || "—") + (atual !== (antes || "") && !info.emailTomadorRemovido ? ` <span class="muted">(antes: ${esc(antes || "nenhum")})</span>` : "");
  dlg.innerHTML = `
    <div class="dlg-cab"><h2>Confirme a emissão</h2>${pilulaAmb(estado.amb)}</div>
    <div class="dlg-corpo">
      <div class="sub" style="margin-bottom:8px">${prod ? "Confira os dados antes de emitir." : "Homologação: a nota é emitida sem validade fiscal."}</div>
      <table><tbody>
        <tr><td>Tomador</td><td>${esc(b.tomaNome)}<div class="muted">${doc(b.tomaDoc)}</div></td></tr>
        <tr><td>E-mail do tomador</td><td>${contato(dados.emailTomador, t.emailTomador)}</td></tr>
        <tr><td>Telefone do tomador</td><td>${contato(dados.foneTomador, t.foneTomador)}</td></tr>
        <tr><td>Competência</td><td>${data(dados.dCompet)}</td></tr>
        <tr><td>Serviço</td><td>${esc(b.cTribNac)} · ${esc(b.xTribNac)}</td></tr>
        <tr><td>Descrição</td><td>${esc(dados.descricao)}</td></tr>
        <tr><td>Valor do serviço</td><td>${brl(dados.vServ)}</td></tr>
        <tr><td>Desconto incondicionado</td><td>${brl(dados.vDescIncond)}</td></tr>
        <tr><td>Base de cálculo</td><td>${brl(baseDe())}</td></tr>
        ${t.pAliqPis != null ? `<tr><td>PIS (${pct(t.pAliqPis)}) / COFINS (${pct(t.pAliqCofins)})</td><td>${brl(imposto(t.pAliqPis))} / ${brl(imposto(t.pAliqCofins))}</td></tr>` : ""}
        <tr><td>ISS</td><td>${t.issRetido ? "retido pelo tomador" : "não retido"}</td></tr>
        ${info.simples ? `<tr><td>% tributos Simples</td><td>${dados.pTotTribSN != null ? pct(dados.pTotTribSN) : "—"}</td></tr>` : ""}
        <tr class="destaque"><td>Valor líquido</td><td>${t.issRetido ? "calculado pela Sefin" : brl(baseDe())}</td></tr>
      </tbody></table>
    </div>
    <!-- Fora da área que rola: a confirmação e o resultado ficam sempre à vista, junto dos botões. -->
    <div class="dlg-acao">
      ${prod ? `<label class="confirmo"><input type="checkbox" id="confirmo"> <span>Confirmo a emissão desta NFS-e para ${esc(b.tomaNome.replace(/\.$/, ""))}.</span></label>` : ""}
      <div id="resultado"></div>
    </div>
    <div class="dlg-rodape">
      <button class="btn sec" id="fechar">Cancelar</button>
      <button class="btn" id="emitir" ${prod ? "disabled" : ""} title="${prod ? "Envia a DPS para a Sefin e emite a NFS-e. Marque a confirmação para liberar." : "Envia a DPS para o ambiente de homologação da Sefin."}">${prod ? "Emitir NFS-e" : "Emitir em homologação"}</button>
    </div>`;
  dlg.showModal();
  $("fechar").onclick = () => dlg.close();
  if (prod) $("confirmo").onchange = () => $("emitir").disabled = !$("confirmo").checked;
  $("emitir").onclick = async () => {
    const botao = $("emitir");
    botao.disabled = true;
    botao.textContent = "Enviando…";
    dados.confirmoProducao = prod && $("confirmo").checked;
    try {
      const r = await post("/api/emitir", dados);
      if (r.ok) {
        dlg.innerHTML = `
          <div class="dlg-cab"><h2>Nota autorizada</h2>${pilulaAmb(estado.amb)}</div>
          <div class="dlg-corpo">
            <div class="numero-grande" style="font-size:34px;font-weight:600">NFS-e nº ${esc(r.numero)}</div>
            <div class="sub" style="margin:4px 0 14px">${esc(b.tomaNome)} · ${brl(dados.vServ)}</div>
            <div class="muted" style="font-size:12px;word-break:break-all">Chave ${esc(r.chave)}</div>
            ${r.alertas.length ? `<div style="margin-top:12px">${mensagem("info", "Alertas: " + r.alertas.map(esc).join("<br>"))}</div>` : ""}
            ${r.ajustes?.length ? `<div style="margin-top:12px">${mensagem("info", "A Sefin recusou o primeiro formato (recusa não cria nota) e o app ajustou: " + r.ajustes.map(esc).join("; ") + ".")}</div>` : ""}
          </div>
          <div class="dlg-rodape">
            <a class="btn sec" href="/api/notas/${r.chave}/xml?amb=${estado.amb}">${icone("baixar")} XML</a>
            <a class="btn sec" href="/api/notas/${r.chave}/pdf?amb=${estado.amb}" target="_blank">${icone("pdf")} PDF</a>
            <button class="btn" id="ver-notas">Ver notas</button>
          </div>`;
        $("ver-notas").onclick = () => { dlg.close(); mostrar("notas"); };
        return;
      }
      $("resultado").innerHTML = r.jaExistia
        ? mensagem("erro", `O número de DPS ${r.nDps} já tinha virado a <strong>NFS-e nº ${r.jaExistia.numero}</strong>:
            ${esc(r.jaExistia.tomaNome)}, ${brl(r.jaExistia.vServ)}, emitida em ${data(r.jaExistia.dhProc)}.<br>
            Se essa é a nota que você queria (por exemplo, uma tentativa anterior que deu certo), <strong>não emita de novo</strong>.
            Se é outra nota, clique em “Tentar de novo”: o app usa o número seguinte.`)
        : mensagem("erro", `Rejeitada (DPS nº ${r.nDps}). Nenhuma nota foi criada.<br>` + r.erros.map(esc).join("<br>")
            + (r.ajustes?.length ? `<br>Ajustes já tentados: ${r.ajustes.map(esc).join("; ")}.` : ""));
      botao.textContent = "Tentar de novo";
      botao.disabled = prod && !$("confirmo").checked;
    } catch (e) {
      $("resultado").innerHTML = mensagem("erro", esc(e.message));
      botao.textContent = "Tentar de novo";
      botao.disabled = prod && !$("confirmo").checked;
    }
  };
}

// ---------- início do app ----------
async function iniciar() {
  montarLateral();
  await sincronizarQuieto(estado.amb);
  mostrar(estado.tela);
}

(async () => {
  estado.info = await api("/api/info");
  document.title = estado.info.nome;
  if (estado.info.temHomologacao) {
    try { estado.amb = localStorage.getItem("amb") === "prod" ? "prod" : "hom"; } catch { estado.amb = "hom"; }
  }
  try { estado.perfil = await api("/api/sessao"); iniciar(); }
  catch { telaLogin(); }
})();
</script>
